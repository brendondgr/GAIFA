# The hub's test suite on Linux and macOS (plan 37.5). Tests that read Linux-only files (/proc, /sys) are
# marked `linux`, and those that need a systemd user manager `systemd`; the macOS job skips both. The mods'
# own suites run in their folders and aren't part of this job.
name: tests

on:
  push:
  pull_request:

jobs:
  hub:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            markers: "not systemd"
          - os: macos-latest
            markers: "not linux and not systemd"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: uv run pytest -m "${{ matrix.markers }}" -q
