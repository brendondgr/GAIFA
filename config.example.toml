# GAIFA settings: the defaults a fresh clone starts from. On the first `gaifa` command (or hub start)
# this file is copied to config.toml, which is yours: it isn't in git, and the Settings page edits it
# and keeps its comments. Each mod ships its own defaults in services/<id>/service.toml; values in
# config.toml override them. Change defaults for everyone here, your own settings in config.toml.

[hub]
host = "127.0.0.1"          # loopback only; anything else is refused at startup
port = 7000
backend = "auto"            # how mods run: auto (systemd units where there's a user manager, else detached processes), systemd, detached, subprocess

# [hub.lan]                 # plan lan-access: other devices on your own network sign in (Settings → General → Network; gaifa lan)
# enabled = false           # needs a password (gaifa lan password) and a restart; this machine (127.0.0.1) never signs in
# bind = "all"              # all: every address, so a new Wi-Fi address is followed | one of this machine's private addresses
# allow = []                # more networks that count as yours, such as Tailscale's "100.64.0.0/10"; never the internet
# names = []                # more host names devices may use (this machine's name and <name>.local always work)
# session_days = 30         # a device stays signed in this long without being used
# https = "also"            # off | also (HTTPS on https_port as well: the microphone needs it) | only (http redirects there)
# https_port = 7443

[paths]                     # relative to this file; must stay inside the project
models = "data/models"
databases = "data/databases"
outputs = "outputs"

[memory]
reserve_gb = 12
auto_make_room = false      # false: ask (Make-room dialog); true: unload idle mods automatically
never_unload = ["lcpp"]     # stopping LLM instances is never automatic
priority = ["comfy", "tts", "gen3d"]   # unloaded first → last

[ports]
new_mods = [5100, 5199]

[ui]
theme = "system"
density = "compact"         # or "comfortable"
# [ui.dashboard] holds the Overview dashboard's layout (order, hidden, shown, sizes, ranges); the UI writes it.
#                sizes: tile key → "xs" 3×1, "s" 4×2, "m" 4×3, "w" 6×3, "l" 8×3 or "f" 12×2; shown: tiles off by default, turned on
# The UI also keeps your choices here, the same in every browser (settings-that-stick):
# [ui.chat]      steps = "fold" | "split" (Steps between messages), environment (a new chat's), [ui.chat.list] (the chat list's view:
#                show = "chats" | "archived" | "both", group = "environment" | "project" | "date" | "none", env_order, chat_order, collapsed)
# [ui.overview]  view = "dashboard" | "table" | "timeline" ("services", from before, opens the dashboard), timeline_range, services_range (1h, 6h, 24h, 7d)

[services]
order = ["relay", "lcpp", "tts", "gen3d", "comfy", "opencode"]

[services.tts]
idle_unload_s = 180

[services.gen3d]
idle_unload_s = 600
# On a machine with more than one GPU, `gpu = <index>` (as `gaifa hardware` numbers them) pins a mod to one;
# the default, "auto", starts it on the freest card (plan 36.3).

[containers]
runtime = "auto"            # the runtime mods run their containers with: auto (podman if installed, else docker), podman, docker

[repos]
fetch_every_h = 24          # relay, lcpp, tts and gen3d are their own repositories: how often to ask GitHub what's new (0 = never)
notify = "warnings"         # warnings: changed files, unpushed commits and the like as alerts; all: updates too; off
check_on_start = true

# Voice mode in Chat (plan voice-speech-model; Settings → Speech → Voice mode).
# [voice_mode]
# engine = "chat"           # chat: the chat's model, heard by the stt mod and read by the tts mod
#                           # speech: the voice mod's speech-to-speech model hears you and speaks, on this machine
# answers = "agent"         # with engine = "speech": agent (the chat's own model answers, with its tools, apps and cards)
#                           # | speech (the speech model answers by itself)
# quant = "q4_k_m"          # the speech model's size: q4_k_m (smaller, faster) | q8_0
# voice = "female"          # female | male
# start_muted = false       # voice mode starts muted (either engine); the bar's mute button and M unmute it
# talk = "open"             # open: always listening | push: heard only while push_key or the bar's button is held
# push_key = "Space"        # push to talk's key: Space | Backquote | F2 | F8 | ControlRight
# interrupt = "speech"      # talking over a reply: speech (a voice stops it, noise doesn't) | off (only Stop and Mute do)

[docs]
regenerate = false          # true keeps this machine's model inventory (data/state/setup/models/, local) current as the registry changes

[agent.screen]
window_chars = 6000

# Sub-agents (plan agent-workflows): a chat may start others to do parts of its task (the `agent` tool).
[agent.workflows]
enabled = true
parallel_local = 1          # at once on this machine's models: they only queue on one GPU
parallel_remote = 3         # at once on remote and cloud models
max_children = 8            # per turn of the chat that starts them
max_depth = 1               # 1: a sub-agent can't start its own
workflow_tokens = 400000    # per turn, every sub-agent's prompt and reply tokens together
min_window = 16384          # the tool only on models with at least this context window

# The Auto judge is always a decision model in the decide mod (d3-lite), never a chat model (plan web-approvals):
# [agent.judge]
# model = "d3-lite"
