# AIHub settings. Each mod ships defaults in services/<id>/service.toml; values here override them.
# The Settings page edits this file and keeps comments. A missing file means the defaults below.

[hub]
host = "127.0.0.1"          # loopback only; anything else is refused at startup
port = 7000

[paths]                     # relative to this file; must stay inside the project
models = "data/models"
databases = "data/databases"
outputs = "outputs"

[memory]
reserve_gb = 12
auto_make_room = false      # false: ask (Make-room dialog); true: unload idle mods automatically
never_unload = ["lcpp"]     # stopping LLM instances is never automatic
priority = ["comfy", "tts", "gen3d"]   # unloaded first → last

[ports]
new_mods = [5100, 5199]

[ui]
theme = "system"
density = "compact"         # or "comfortable"
# [ui.dashboard] holds the Overview dashboard's layout (order, hidden, ranges); the UI writes it.

[services]
order = ["relay", "lcpp", "tts", "gen3d", "comfy", "opencode"]

[services.tts]
enabled = true
autostart = true
idle_unload_s = 180

[services.gen3d]
enabled = true
autostart = true
idle_unload_s = 600

[services.comfy]
enabled = true
autostart = false

[services.vllm]
enabled = true
autostart = false              # parked 2026-10-20: its models were deleted; profiles in services/vllm/profiles/disabled/

[docs]
regenerate = false             # plan 23.6: true keeps this machine's model inventory (data/state/setup/models/, local) current as the registry changes

[agent.judge]
model = "gemma4-26B"

[agent.screen]
window_chars = 6000
