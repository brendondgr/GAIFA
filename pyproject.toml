[project]
name = "gaifa"
version = "0.1.0"
description = "GAIFA (Great, Another Interface For Agents): a modular, local server for AI apps you build as mods, used through one agent that learns how you work"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "tomlkit",
    "watchfiles",
    "pillow",
    "huggingface-hub>=2.2,<3",
    "websockets",           # the proxy passes mod WebSockets through (plan 29.2)
    "pypdfium2>=5.14.0",
    "psutil>=6",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["utils/tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = ["systemd: needs a systemd user manager (skipped where there is none)", "linux: reads Linux-only files (/proc, /sys); skipped in the macOS CI job"]
asyncio_default_fixture_loop_scope = "function"
