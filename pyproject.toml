[project]
name = "lcpp"
version = "0.1.0"
description = "Launch, manage and relay-publish llama.cpp model servers on this machine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
lcpp = "lcpp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcpp"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# A hung lifecycle test should fail fast, not stall the suite.
timeout = 60
