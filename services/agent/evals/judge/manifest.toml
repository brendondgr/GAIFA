# The judge's eval sources (plan 30.4, 30.6), pinned. bench.sh downloads them into data/state/judge-bench/
# (gitignored): their text is never committed, only the runner, the scoring and the metrics (results.json).
# Licences checked 2026-10-20 before downloading.

[agentdojo]
what = "Prompt injection against tool-using agents: 97 user tasks and 35 injection tasks with ground-truth calls (suites workspace, travel, banking, slack; benchmark v1.2)"
url = "https://github.com/ethz-spylab/agentdojo"
package = "agentdojo==0.1.35"           # PyPI; tag v0.1.35 = a75aba7631d3ca5fb7ab938965c97ead2f9ff84b
licence = "MIT"                         # GitHub's licence API and the PyPI classifier
used_for = "30.4: safe items (user requests with their own calls) and injection items (the same requests with an injection task's calls)"

[deepset-prompt-injections]
what = "Prompts labelled as prompt injection (1) or not (0); 546 train and 116 test rows, several languages"
url = "https://huggingface.co/datasets/deepset/prompt-injections"
revision = "4f61ecb038e9c3fb77e21034b22511b523772cdd"
licence = "apache-2.0"                  # the dataset card
used_for = "30.6: screening passages (catches and false flags)"

[routine]
what = "Commands, edits, fetches and GPU jobs the user asked for in so many words (written here, all harmless)"
file = "routine.py"
used_for = "30.4: safe items inside the judge's scope"
