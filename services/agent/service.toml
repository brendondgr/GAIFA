# GAIFA's chat agent (plan Phase 14): our own Claude-Code-style loop. The model comes from the
# relay (every call shows on its Requests page); tools come from the hub's catalog.
id = "agent"
name = "Agent"
description = "The chat agent: asks, shows parameter cards, chains outputs"
icon = "chat"
version = "0.1.0"

[run]
command = [".venv/bin/python", "-m", "agent"]
port = 5100
health = "/health"
status = "/v1/status"
openapi = "/openapi.json"
env = { AGENT_DB = "{databases}/agent.db", AGENT_DATA = "{root}/data/agent", AGENT_LLM_URL = "http://127.0.0.1:4000/v1", AGENT_MODEL = "skynet", AGENT_FALLBACK_MODEL = "", AGENT_MAX_STEPS = "25", AGENT_INLINE_TOKENS = "6000" }
start_timeout_s = 20
stop_timeout_s = 15
restart = "on-failure"
after = ["relay"]
install = "install.sh"

[ui]
page = "ui/page.js"          # the Learning page (plan 21.7): preferences, review, tool usage

[[ui.widgets]]
id = "corrections"
title = "Card corrections per day"
kind = "bar"
source = "GET /v1/widgets/corrections"
ranges = ["7d", "30d"]
span = 4

[[ui.widgets]]
id = "messages"
title = "Chat messages per day"
kind = "bar"
source = "GET /v1/widgets/messages"
ranges = ["7d", "30d"]
span = 4

# The agent's own memory tools (plan structured-memory 3.2): agent_memory_*, never offered at /mcp (mcp = false).
# `remember` (a local name the model knows) runs as agent_memory_save.
[tools]
memory_save = { op = "POST /v1/memory/save", risk = "write", mcp = false, description = "Remember a lasting fact the user told you, about them or about a project, person, place, tool or topic (what it's about goes in about, by name or path). It goes into later chats. Use memory_search first when it may replace an older fact, and pass that one as replaces." }
memory_entity = { op = "POST /v1/memory/entity", risk = "write", mcp = false, description = "Make an entry in memory (a project, person, place, tool, topic), or rename one (the old name stays an alias), move it under another, add other names or a one-line summary." }
memory_forget = { op = "POST /v1/memory/forget", risk = "destructive", mcp = false, description = "Forget a fact for good, only when the user asks you to forget it." }
# GAIFA's chats for other agents (plan agent-workflows 4.1): offered at /mcp; GAIFA's own chats use their agent tool instead.
chat_start = { op = "POST /v1/external/start", risk = "execute", description = "Start a chat in GAIFA's agent (it has GAIFA's tools: images, video, 3D, speech, the workspace folders, the web) with `prompt` as its first message. It runs on its own: wait for it with agent_chat_wait and read its answer with agent_chat_read. What it does that changes things asks the user in GAIFA, not you. mode: manual (asks first) by default, or plan, accept_edits, auto; never bypass." }
chat_send = { op = "POST /v1/external/send", risk = "execute", description = "Write to a GAIFA chat you started (a follow-up or a correction); held until its turn ends if it is running." }
chat_read = { op = "POST /v1/external/read", risk = "read", description = "Read a GAIFA chat you started: its state, its last answer, its new messages after `after`, its sub-agents, and what waits for the user (waiting_for_you: they decide it in GAIFA; tell them)." }
chat_wait = { op = "POST /v1/external/wait", risk = "read", description = "Wait up to `timeout` seconds (60 at most) for a GAIFA chat you started to end its turn, then read it. Call it again while it is still running." }
chat_stop = { op = "POST /v1/external/stop", risk = "write", description = "Stop a GAIFA chat you started, and its sub-agents." }
chat_list = { op = "POST /v1/external/list", risk = "read", description = "The GAIFA chats you started, newest first." }

[api]
hide = ["GET /v1/threads/{tid}/stream"]
[api.responses]
"GET /v1/threads/{tid}/stream" = "stream"
