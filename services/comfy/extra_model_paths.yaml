# Where ComfyUI finds models and custom nodes (passed by bin/comfyui as --extra-model-paths-config).
# $COMFY_MODELS is set by bin/comfyui: AIHub's data/models/comfyui unless overridden.
# Relative base paths resolve against this file's folder (ComfyUI's utils/extra_config.py).
comfyui:
    base_path: $COMFY_MODELS
    is_default: true
    audio_encoders: audio_encoders
    checkpoints: checkpoints
    clip: clip
    clip_vision: clip_vision
    configs: configs
    controlnet: controlnet
    detection: detection
    diffusers: diffusers
    diffusion_models: diffusion_models
    embeddings: embeddings
    geometry_estimation: geometry_estimation
    gligen: gligen
    hypernetworks: hypernetworks
    latent_upscale_models: latent_upscale_models
    loras: loras
    model_patches: model_patches
    photomaker: photomaker
    style_models: style_models
    text_encoders: text_encoders
    ultralytics: ultralytics
    unet: unet
    upscale_models: upscale_models
    vae: vae
    vae_approx: vae_approx
aihub_mod:
    base_path: ./
    # custom_nodes/: third-party packages (ComfyUI-Manager installs, gitignored).
    # nodes/: AIHub's own nodes and fixes (tracked; nodes/aihub_nodes/__init__.py says what they do).
    custom_nodes: |
        custom_nodes
        nodes
