# Images & Video: an adapter for ComfyUI (plan Phase 11). The adapter (port 5070) starts ComfyUI in
# the strix-halo-comfyui toolbox (port 8199) on load, and runs workflow packs from workflows/.
# Fields: architecture §4.3. Workflow packs: docs/workflows.md.
id = "comfy"
name = "Images & Video"
description = "ComfyUI workflows: text to image, image edits and video"
icon = "image"
version = "0.1.0"

[run]
command = [".venv/bin/python", "-m", "comfy"]
port = 5070
health = "/health"
status = "/v1/status"
openapi = "/openapi.json"
start_timeout_s = 30
stop_timeout_s = 30
restart = "on-failure"
install = "install.sh"

[run.env]
COMFY_URL = "http://127.0.0.1:8199"
COMFY_DATA = "{service_dir}/data"
COMFY_DB = "{databases}/comfy.db"
COMFY_OUTPUTS = "{outputs}"
COMFY_WORKFLOWS = "{service_dir}/workflows"
COMFY_CONTROL = "{service_dir}/bin/comfyui"
COMFY_MODELS = "{models}/comfyui"

[memory]
estimate_gb = 24                    # a typical image workflow; each run acquires its pack's own amount
load = "POST /v1/load"
unload = "POST /v1/unload"
triggers = ["POST /v1/load"]
containers = ["strix-halo-comfyui"]
idle_unload_s = 600
idle_unload_env = "COMFY_IDLE_UNLOAD_S"

[gpu]                               # plan 31.3: each run takes the GPU slot before memory, and holds it until its prompt ends
class = "job"

[models]
dirs = ["comfyui"]

[outputs]
kinds = ["image", "video", "model3d"]

[ui]
page = "ui/page.js"
chat = "ui/chat.js"                 # live cards in Chat for the picture and video tools (plan 45.2)
native = "http://127.0.0.1:8199/"

[[ui.widgets]]
id = "made"
title = "Images & videos per day"
kind = "bar"
source = "GET /v1/hub/widgets/made"
ranges = ["7d", "30d"]
span = 4

[api]
hide = ["GET /v1/hub/*"]

[api.responses]
"GET /v1/files/{path}" = "file"
"GET /v1/workflows/{wid}/preview" = "image"

[agent]
skills = "skills"
tools_source = "GET /v1/tools"    # one tool per task (generate_image, animate_image, …); plan 11.10

[tools]
job = { op = "GET /v1/jobs/{job_id}", description = "A run's state and its output files" }
cancel = { op = "POST /v1/queue/{job_id}/cancel", description = "Cancel a waiting or running run", confirm = true }
