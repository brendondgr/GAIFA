# Tasks a workflow pack can implement (`task = "…"` in its workflow.toml), and the shared input
# names packs use. The agent gets one tool per task that has a ready pack (`tool`), so any pack
# that implements a task can stand in for another. Add a task by adding a table here; a task's
# [tasks.<id>.inputs] table gives a shared input a description of its own in that task's tool.
# Guide: docs/workflows.md.

[tasks.text-to-image]
name = "Text to image"
tool = "generate_image"
description = "Make an image from a text description."
required = ["prompt"]
output = "image"

[tasks.image-edit]
name = "Image edit"
tool = "edit_image"
description = "Change an existing image as the prompt instructs."
required = ["image", "prompt"]
output = "image"

[tasks.image-to-video]
name = "Image to video"
tool = "animate_image"
description = "Animate a still image into a short video, guided by a prompt."
required = ["image", "prompt"]
output = "video"

[tasks.text-to-video]
name = "Text to video"
tool = "generate_video"
description = "Make a short video from a text description."
required = ["prompt"]
output = "video"

[tasks.upscale]
name = "Upscale"
tool = "upscale_image"
description = "Make an image larger and sharper."
required = ["image"]
output = "image"

[tasks.remove-background]
name = "Remove background"
tool = "remove_background"
description = "Cut the subject out of an image, leaving a transparent background. When the user names what to keep, or the image is a scene (a building, a room), pass prompt with just those words (\"the storefront\", \"the woman on the left\"): the workflow turns them into its instruction. Without a prompt the model guesses the subject."
required = ["image"]
output = "image"

[tasks.remove-background.inputs]     # this tool's own description of a shared input
prompt = "What to keep, in a few words (\"the storefront\", \"the woman on the left\"). Pass it whenever the user names what to keep or the picture is a scene; leave it out only for one obvious subject."

[tasks.image-to-3d]
name = "Image to 3D"
description = "Make an untextured 3D mesh from one picture. Run through 3D Generate (gen3d's make_3d), which owns the job, viewer and follow-ups; no agent tool here."
required = ["image"]
output = "mesh"

[tasks.custom]
name = "Custom"
description = "Anything else: offered to the agent only through run_workflow."
required = []

# ---- shared input names --------------------------------------------------------------------
# `type` is the JSON type; `derived` inputs aren't graph fields: the adapter turns them into the
# fields a pack does map (aspect + megapixels → width/height, seconds → frames).

[inputs.prompt]
type = "string"
description = "What to make, in plain words"

[inputs.references]
type = "files"
description = "Extra pictures the instruction refers to as <image2>, <image3>, … (a hat to put on her, a style to copy); the picture to change is `image`"

[inputs.negative]
type = "string"
description = "What to avoid"

[inputs.image]
type = "file"
description = "The input image: an AIHub output id or an uploaded file"

[inputs.images]
type = "files"
description = "Several input images (references)"

[inputs.video]
type = "file"
description = "An input video (a clip to restyle, or one whose motion drives the result)"

[inputs.mask]
type = "file"
description = "A mask image: white is the area to change"

[inputs.width]
type = "integer"
description = "Width in pixels"

[inputs.height]
type = "integer"
description = "Height in pixels"

[inputs.aspect]
type = "string"
derived = true
description = "Aspect ratio such as 1:1, 16:9 or 9:16 (sets width and height)"
choices = ["1:1", "4:3", "3:4", "3:2", "2:3", "16:9", "9:16", "21:9"]

[inputs.megapixels]
type = "number"
derived = true
description = "Image size in megapixels, used with aspect (default 1.0)"

[inputs.seed]
type = "integer"
description = "Random seed; -1 picks one"

[inputs.steps]
type = "integer"
description = "Sampling steps"

[inputs.cfg]
type = "number"
description = "Prompt guidance (CFG)"

[inputs.strength]
type = "number"
description = "How much to change the input image (denoise), 0 to 1"

[inputs.frames]
type = "integer"
description = "Number of video frames"

[inputs.fps]
type = "integer"
description = "Frames per second"

[inputs.seconds]
type = "number"
derived = true
description = "Video length in seconds (sets frames)"
