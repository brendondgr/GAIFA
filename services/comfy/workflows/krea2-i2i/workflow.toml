name = "Krea 2 Turbo — image to image (whole-frame denoise)"
task = "image-edit"
edit = "restyle"

[inputs.prompt]          # CLIPTextEncode "Positive prompt"
node = "5"
field = "text"

[inputs.seed]          # KSampler "KSampler  ·  denoise 0.50"
node = "11"
field = "seed"
default = -1

[inputs.steps]          # KSampler "KSampler  ·  denoise 0.50"
node = "11"
field = "steps"

[inputs.cfg]          # KSampler "KSampler  ·  denoise 0.50"
node = "11"
field = "cfg"

[inputs.strength]          # KSampler "KSampler  ·  denoise 0.50"
node = "11"
field = "denoise"

[inputs.width]          # ImageScale "Resize to 832x1248 (/16 clean)"
node = "9"
field = "width"

[inputs.height]          # ImageScale "Resize to 832x1248 (/16 clean)"
node = "9"
field = "height"

[inputs.image]          # LoadImage "Source image"
node = "8"
field = "image"

[outputs.image]
node = "13"
kind = "image"
