name = "Krea 2 Turbo — text to image"
task = "text-to-image"

[inputs.prompt]          # CLIPTextEncode "Positive prompt"
node = "5"
field = "text"

[inputs.seed]          # KSampler "KSampler  ·  turbo = 10 steps @ CFG 1.0"
node = "9"
field = "seed"
default = -1

[inputs.steps]          # KSampler "KSampler  ·  turbo = 10 steps @ CFG 1.0"
node = "9"
field = "steps"

[inputs.cfg]          # KSampler "KSampler  ·  turbo = 10 steps @ CFG 1.0"
node = "9"
field = "cfg"

[inputs.width]          # EmptySD3LatentImage "Empty latent 832x1248"
node = "8"
field = "width"

[inputs.height]          # EmptySD3LatentImage "Empty latent 832x1248"
node = "8"
field = "height"

[outputs.image]
node = "11"
kind = "image"
