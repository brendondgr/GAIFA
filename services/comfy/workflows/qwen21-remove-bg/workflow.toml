name = "Qwen-Image 2.1 — remove background"
task = "remove-background"
# memory_gb = 39.5    # estimated from the model files; each run measures it, so set it only to override

[inputs.prompt]          # TextEncodeQwenImage21 "Instruction"
node = "8"
field = "prompt"
template = "Extract {} in <image1> and remove everything else. Output a PNG image."   # "the storefront" → this; a full instruction is used as it is

[inputs.seed]          # KSampler "KSampler"
node = "12"
field = "seed"
default = -1

[inputs.steps]          # KSampler "KSampler"
node = "12"
field = "steps"

[inputs.cfg]          # KSampler "KSampler"
node = "12"
field = "cfg"

[inputs.image]          # LoadImage "image_1 · edit target"
node = "7"
field = "image"

[outputs.image]
node = "14"
kind = "image"
