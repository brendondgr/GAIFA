name = "Qwen-Image 2.1 Turbo — edit with references"
task = "image-edit"
description = "Qwen-Image 2.1 Turbo (official 8-step distill): edit image_1 as the instruction says, optionally using image_2 as a reference (<image1>, <image2> in the prompt); about 3x faster than qwen21-edit-multi"
tags = ["edit", "references", "fast"]
# memory_gb = 21.9    # estimated from the model files; each run measures it, so set it only to override

[inputs.prompt]          # TextEncodeQwenImage21 "Instruction (use <image1>, <image2>, …)"
node = "13"
field = "prompt"

[inputs.seed]          # RandomNoise "Seed"
node = "18"
field = "noise_seed"
default = -1

[inputs.cfg]          # CFGGuider "CFG (1 = official)"
node = "19"
field = "cfg"

[inputs.image]          # LoadImage "image_1 · edit target"
node = "7"
field = "image"

[inputs.image_2]          # LoadImage "image_2 · reference"
node = "8"
field = "image"

[outputs.image]
node = "23"
kind = "image"
