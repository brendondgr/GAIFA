name = "Qwen-Image 2.1 Turbo — edit with references"
task = "image-edit"
description = "Qwen-Image 2.1 Turbo (official 8-step distill): edit image_1 as the instruction says, optionally using image_2 as a reference (<image1>, <image2> in the prompt); about 2 min, or 40 s with the fast preset; `megapixels` sets the result size (1.0 = 1024×1024)"
tags = ["edit", "references", "fast"]
# memory_gb = 21.9    # estimated from the model files; each run measures it, so set it only to override

[inputs.prompt]          # AIHubTextEncodeQwenImage21 "Instruction (use <image1>, <image2>, …)"
node = "13"
field = "prompt"

[inputs.seed]          # RandomNoise "Seed"
node = "18"
field = "noise_seed"
default = -1

[inputs.cfg]          # CFGGuider "CFG (1 = official)"
node = "19"
field = "cfg"

[inputs.image]          # LoadImage "image_1 · edit target"
node = "7"
field = "image"

[inputs.image_2]          # LoadImage "image_2 · reference"
node = "8"
field = "image"

[inputs.resolution]          # AIHubTextEncodeQwenImage21 "Instruction"
node = "13"
field = "resolution"
label = "Working size"
description = "Pixel budget the input images are read at, as N×N (default 1024); smaller is faster but keeps less detail. The result follows image 1 at this size."

[presets.fast]               # 768 × 768 working size (~0.6 MP result), about a third of the time (docs/comfy-transfer-report.md)
megapixels = 0.56

[presets.draft]              # 576 × 576 working size (~0.33 MP result): for previews only
megapixels = 0.32

[outputs.image]
node = "23"
kind = "image"
