name = "Qwen-Image 2.1 Turbo — remove background"
task = "remove-background"
description = "Qwen-Image 2.1 Turbo (official 8-step distill): cut the subject out of an image as a transparent PNG; about 3x faster than qwen21-remove-bg"
tags = ["transparent", "fast"]
# memory_gb = 21.9    # estimated from the model files; each run measures it, so set it only to override

[inputs.prompt]          # TextEncodeQwenImage21 "Instruction"
node = "8"
field = "prompt"

[inputs.seed]          # RandomNoise "Seed"
node = "13"
field = "noise_seed"
default = -1

[inputs.cfg]          # CFGGuider "CFG (1 = official)"
node = "14"
field = "cfg"

[inputs.image]          # LoadImage "image_1 · edit target"
node = "7"
field = "image"

[outputs.image]
node = "18"
kind = "image"
