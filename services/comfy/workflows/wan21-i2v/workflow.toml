name = "Wan 2.1 — image to video"
task = "image-to-video"
description = "Animate a still image into a ~5 s 480p clip (Wan 2.1 14B, LightX2V 6 steps)"
# memory_gb = 30.5    # estimated from the model files; each run measures it, so set it only to override

[inputs.prompt]          # CLIPTextEncode "Positive prompt"
node = "7"
field = "text"

[inputs.seed]          # KSampler "KSampler · 6 steps @ CFG 1.0"
node = "15"
field = "seed"
default = -1

[inputs.steps]          # KSampler "KSampler · 6 steps @ CFG 1.0"
node = "15"
field = "steps"

[inputs.cfg]          # KSampler "KSampler · 6 steps @ CFG 1.0"
node = "15"
field = "cfg"

[inputs.width]          # WanImageToVideo "WanImageToVideo  ← rewrites the conditioning"
node = "14"
field = "width"
also = ["11.width"]

[inputs.height]          # WanImageToVideo "WanImageToVideo  ← rewrites the conditioning"
node = "14"
field = "height"
also = ["11.height"]

[inputs.frames]          # WanImageToVideo "WanImageToVideo  ← rewrites the conditioning"
node = "14"
field = "length"

[inputs.fps]          # CreateVideo "CreateVideo @ 16 fps"
node = "17"
field = "fps"

[inputs.image]          # LoadImage "Source image"
node = "10"
field = "image"

[outputs.video]
node = "18"
kind = "video"

[presets.short]
frames = 33
