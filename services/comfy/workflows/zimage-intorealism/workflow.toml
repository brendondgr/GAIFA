name = "Z-Image IntoRealism + watercolor"
task = "text-to-image"
description = "Z-Image Turbo fine-tune (IntoRealism v6) with a watercolor LoRA: painterly images"
tags = ["watercolor", "style"]
# memory_gb = 17.6    # estimated from the model files; each run measures it, so set it only to override

[inputs.prompt]          # CLIPTextEncode "CLIP Text Encode (Prompt)"
node = "67"
field = "text"

[inputs.negative]          # CLIPTextEncode "CLIP Text Encode (Prompt)"
node = "71"
field = "text"

[inputs.seed]          # KSampler "KSampler"
node = "70"
field = "seed"
default = -1

[inputs.steps]          # KSampler "KSampler"
node = "70"
field = "steps"

[inputs.cfg]          # KSampler "KSampler"
node = "70"
field = "cfg"

[inputs.width]          # EmptySD3LatentImage "EmptySD3LatentImage"
node = "68"
field = "width"

[inputs.height]          # EmptySD3LatentImage "EmptySD3LatentImage"
node = "68"
field = "height"

[outputs.image]
node = "77"
kind = "image"

[inputs.lora_strength]          # LoraLoaderModelOnly: how strongly the watercolor style applies (added by hand)
node = "72"
field = "strength_model"
label = "Watercolor strength"
min = 0
max = 1.5

[presets.subtle]
lora_strength = 0.4

[presets.portrait]
width = 832
height = 1216
