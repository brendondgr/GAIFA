name = "Z-Image Turbo"
description = "Fast photoreal text to image (Z-Image Turbo, 8 steps)"
tags = ["photo", "fast"]
task = "text-to-image"
good_for = "photoreal pictures, quickly"
# memory_gb = 10.1    # estimated from the model files; each run measures it, so set it only to override
agent = false                        # its models were deleted on 2026-10-20 to free disk space

[inputs.prompt]          # CLIPTextEncode "CLIP Text Encode (Prompt)"
node = "67"
field = "text"

[inputs.negative]          # CLIPTextEncode "CLIP Text Encode (Prompt)"
node = "71"
field = "text"

[inputs.seed]          # KSampler "KSampler"
node = "70"
field = "seed"
default = -1

[inputs.steps]          # KSampler "KSampler"
node = "70"
field = "steps"

[inputs.cfg]          # KSampler "KSampler"
node = "70"
field = "cfg"

[inputs.width]          # EmptySD3LatentImage "EmptySD3LatentImage"
node = "68"
field = "width"

[inputs.height]          # EmptySD3LatentImage "EmptySD3LatentImage"
node = "68"
field = "height"

[outputs.image]
node = "9"
kind = "image"

[presets.portrait]
width = 832
height = 1216

[presets.landscape]
width = 1216
height = 832

[set]
"66.unet_name" = "z_image_turbo_fp8_e4m3fn.safetensors"   # the bf16 file this graph names isn't downloaded

[presets.fast]               # ~0.6 MP: quicker, smaller; small text can break (same names as the Qwen Turbo packs)
quality = "fast"
megapixels = 0.6

[presets.draft]              # ~0.35 MP: previews and lots of variations
quality = "draft"
megapixels = 0.35
