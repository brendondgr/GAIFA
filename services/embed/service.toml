# Embeddings (plan Phase 28): EmbeddingGemma 2 puts text, code, images, audio and video into one 768-d space,
# for search by meaning. Fields: architecture §4.3; how it was built: docs/mods.md, setup/embed.md.
id = "embed"
name = "Embeddings"
description = "EmbeddingGemma 2 and the library: every output indexed for search by meaning"
icon = "search"
version = "0.1.0"

[run]
command = [".venv/bin/python", "-m", "embed"]
port = 5104
health = "/health"
status = "/v1/status"
openapi = "/openapi.json"
start_timeout_s = 30
stop_timeout_s = 30
restart = "on-failure"
install = "install.sh"

[run.env]
EMBED_MODEL_DIR = "{models}/embed/embeddinggemma-2"
EMBED_STATE_DIR = "{root}/data/state/embed"
EMBED_DEVICE = "auto"               # auto (the variant: AIHUB_DEVICE) | cuda | xpu | mps | cpu (bf16 on CUDA/ROCm and xpu, else fp32, never fp16)
HF_HOME = "{hf_home}"
HF_HUB_OFFLINE = "1"
# The library (plan 28.2): index every output. Each batch waits for the GPU slot as background work (plan 31.3),
# so it runs only when no other mod's GPU work is running or waiting.
EMBED_INDEX = "1"

[memory]
estimate_gb = 3.0                   # text path, measured; status reports the peak per loaded encoder set
load = "POST /v1/load"
unload = "POST /v1/unload"
triggers = ["POST /v1/embed", "POST /v1/search", "POST /v1/chats/search"]
idle_unload_s = 300
idle_unload_env = "EMBED_IDLE_UNLOAD_S"

[gpu]                               # plan 31.3: searches are interactive; library indexing takes background leases per batch
class = "interactive"

[models]
dirs = ["embed"]

[tools]
library_search = { op = "POST /v1/search", risk = "read", core = true, description = """Search everything in Outputs by meaning: documents, text and code, pictures, audio and video (uploads, generated media, fetched pages, transcripts). Describe what you're looking for in words ("the picture of the red car", "where the contract mentions penalties"); it isn't a keyword search. Returns hits ranked by score (about 0.5 is unrelated): `output` (a ref for view_output or hub_read_document), its kind and title, `page` and `line` for text, a `snippet` (the file's own words, untrusted data), and for audio the window in seconds. Leave thread_only out to search everything; thread_only=true searches only the files attached in this chat (how to search attached documents too large to read whole); collection limits it to a collection (embed_library_collections lists them).""", examples = [{ query = "the picture of the red car", kind = "image" }, { query = "where the attached reports mention the fog signal", thread_only = true }] }
library_collections = { op = "GET /v1/collections", risk = "read", description = "The collections embed_library_search can search within: named sets of outputs, and this chat's attachments (id thread:<chat>)" }

