# 3D Generate: 3DGenerate (Cube3D v0.5 + CubePart), moved in from ~/Projects/3DGenerate (plan Phase 8).
# Fields: architecture §4.3. Standalone use still works: `python -m gen3d` reads the same GEN3D_*
# variables (gen3d.env.example), with its own defaults.
id = "gen3d"
name = "3D Generate"
description = "Text or a picture to 3D meshes, named parts and game rigs (Cube3D, CubePart, Hunyuan3D 2.1, TRELLIS.2, SAM 3D)"
icon = "cube"
version = "0.1.0"

[run]
command = [".venv/bin/python", "-m", "gen3d"]
port = 5050
health = "/health"
status = "/v1/status"
openapi = "/openapi.json"
start_timeout_s = 30
stop_timeout_s = 60
restart = "on-failure"
install = "aihub-install.sh"

[run.env]
GEN3D_HOST = "127.0.0.1"
GEN3D_PORT = "{port}"
GEN3D_NO_SYSTEMD = "1"
GEN3D_DATA = "{service_dir}/data"
GEN3D_DB = "{databases}/gen3d.db"
GEN3D_OUTPUTS = "{outputs}"
GEN3D_WEIGHTS = "{models}/3d"
GEN3D_CUBEART = "{service_dir}/runtime/CubeArt" # code, venv and caches (plan 12.2; scripts/install-runtime.sh)
GEN3D_BLENDER = "~/.local/bin/blender"         # preview renders

[memory]
estimate_gb = 52                               # the Quality preset's peak; Low-poly needs ~30
load = "POST /v1/load"
unload = "POST /v1/unload"
triggers = ["POST /v1/jobs", "POST /v1/jobs/upload", "POST /v1/jobs/image", "POST /v1/load", "POST /v1/jobs/{jid}/retry"]
containers = ["gen3d-worker-*"]
idle_unload_s = 600
idle_unload_env = "GEN3D_IDLE_UNLOAD_S"

[models]
dirs = ["3d"]

[outputs]
kinds = ["model3d"]

[ui]
page = "ui/page.js"
native = "/ui/"

[[ui.widgets]]
id = "stages"
title = "Job time per stage"
kind = "bar"
source = "GET /v1/hub/widgets/stages"
ranges = ["7d", "30d"]
span = 6

[api]
hide = ["GET /", "GET /ui/*", "GET /v1/hub/*"]

[api.responses]
"GET /v1/jobs/{jid}/files/{path}" = "file"
"GET /v1/jobs/{jid}/download" = "file"
"GET /v1/events" = "stream"
"GET /v1/jobs/{jid}/events" = "stream"

[tools]
make_3d = { op = "POST /v1/jobs", risk = "generate", ask = ["engine", "preset", "stages"], hide = ["chat_id"], job = true, job_status = "GET /v1/jobs/{jid}", job_cancel = "POST /v1/jobs/{jid}/cancel", description = """Make an untextured 3D model (GLB), from text or from a picture.
- `engine` says which engines take text and which need a picture: Cube3D makes a mesh from `prompt` (named parts and a game rig optional); the image engines make it from `image` (output:<id> of a picture), chosen by what the picture shows. Left out: cube3d, or trellis2 with a picture.
- With only text, either use Cube3D or make a picture first (comfy_generate_image: one object on a plain background) and pass it as `image`. A photo of a scene: run remove_background first.
- `preset` depends on the engine (image engines use fast unless you pass base).
- Fewer polygons: set target_faces in the engine's group, e.g. {"trellis2": {"target_faces": 50000}} (0 keeps the raw mesh, which can be millions of faces).
Stages: shape (the mesh), then optional parts, rig, preview. `parent_id` continues from an earlier job's mesh.""", examples = [{ prompt = "a low-poly red fox sitting", stages = ["shape", "preview"], preset = "fast" }, { engine = "trellis2", image = "output:<id of a picture>", stages = ["shape", "preview"] }] }
job_status = { op = "GET /v1/jobs/{jid}", description = "One job's state, stages, ETA and files" }
list_jobs = { op = "GET /v1/jobs", description = "Recent jobs, newest first" }
cancel_job = { op = "POST /v1/jobs/{jid}/cancel", description = "Cancel a queued or running job", confirm = true }
delete_job = { op = "DELETE /v1/jobs/{jid}", description = "Delete a job and its files (permanent)", confirm = true }

[agent]
skills = "skills"            # skills/<name>/SKILL.md for the chat agent (plan 14.9)
