# Speech to Text: faster-whisper (CTranslate2) in its own worker process, a toned-down port of the
# TranscriberPrototype (plan Phase 29). Fields: architecture §4.3. Setup: setup/stt.md.
id = "stt"
name = "Speech to Text"
description = "Transcribe audio and video with Whisper (faster-whisper): files to transcripts, and live dictation"
icon = "wave"
version = "0.1.0"

[run]
command = [".venv/bin/python", "server.py"]
port = 5105
health = "/health"
status = "/v1/status"
openapi = "/openapi.json"
start_timeout_s = 30
stop_timeout_s = 20
restart = "on-failure"
install = "install.sh"

[run.env]
STT_DEVICE = "auto"                # auto | cpu | cuda
HF_HUB_OFFLINE = "0"               # weights download into {models}/stt, never ~/.cache

[memory]
estimate_gb = 1.5                  # small at float16 on the GPU, measured ~1.2 GB; large-v3 needs ~5
load = "POST /v1/load"
unload = "POST /v1/unload"
triggers = ["POST /v1/transcribe", "POST /v1/transcribe/upload", "POST /v1/load"]
idle_unload_s = 300
idle_unload_env = "STT_IDLE_UNLOAD_S"

[models]
dirs = ["stt"]

[outputs]
kinds = ["text"]
