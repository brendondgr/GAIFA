# Speech: LocalTTS (Breeze TTS 2 + Kokoro), moved in from ~/Projects/LocalTTS (plan Phase 7).
# Fields: architecture §4.3. Standalone use still works: `python -m localtts` reads the same
# LOCALTTS_* variables (localtts.env.example), with its own defaults.
id = "tts"
name = "Speech"
description = "Text to speech with Breeze TTS 2 and Kokoro: voice cloning and voice design"
icon = "wave"
version = "0.6.1"

[run]
command = [".venv/bin/python", "-m", "localtts"]
port = 5040
health = "/health"
status = "/v1/status"
openapi = "/openapi.json"
start_timeout_s = 30
stop_timeout_s = 180               # in-flight generations finish on stop (uvicorn waits 150 s)
restart = "on-failure"
install = "aihub-install.sh"

[run.env]
LOCALTTS_HOST = "127.0.0.1"
LOCALTTS_PORT = "{port}"
LOCALTTS_NO_SYSTEMD = "1"
LOCALTTS_DATA = "{service_dir}/data"
LOCALTTS_OUTPUTS_DIR = "{outputs}"
LOCALTTS_VOICES_DIR = "{models}/voices"
# The engines run from runtime/ (plan 12.1; rebuilt by scripts/install-runtime.sh).
LOCALTTS_BREEZE_PYTHON = "{service_dir}/runtime/venvs/breeze-tts/bin/python"
LOCALTTS_KOKORO_PYTHON = "{service_dir}/runtime/venvs/kokoro/bin/python"
BREEZE_REPO = "{service_dir}/runtime/breeze-tts"
BREEZE_MODEL = "{models}/tts/breeze-tts-2"
HF_HOME = "{hf_home}"
HF_HUB_OFFLINE = "1"
LOCALTTS_LLM_URL = "http://127.0.0.1:4000/v1"

[memory]
estimate_gb = 13               # measured: Breeze 3.1 GB RAM + 9.9 GB GTT (Kokoro adds ~2.7 GB)
load = "POST /v1/load"
unload = "POST /v1/unload"
triggers = ["POST /v1/speech", "POST /v1/audio/speech", "POST /v1/voices/design", "POST /v1/voices", "POST /v1/align"]
idle_unload_s = 180
idle_unload_env = "LOCALTTS_IDLE_UNLOAD_S"

[models]
dirs = ["tts", "voices"]

[gpu]                          # plan 31.3: each synthesis takes the GPU slot (localtts/engines.py)
class = "job"
group = "tts"

[outputs]
kinds = ["audio"]

[ui]
page = "ui/page.js"
chat = "ui/chat.js"                 # the live speech card in Chat (plan 45.4)
native = "/ui/"

[[ui.widgets]]
id = "clips"
title = "Clips per day"
kind = "bar"
source = "GET /v1/hub/widgets/clips"
ranges = ["7d", "30d"]
span = 6

[api]
hide = ["GET /", "GET /ui/*", "GET /v1/hub/*"]

[api.responses]
"POST /v1/speech" = "audio"
"POST /v1/audio/speech" = "audio"
"GET /v1/voices/{name}/audio" = "audio"
"GET /v1/outputs/{filename}" = "audio"

[tools]
speak = { op = "POST /v1/speech/jobs", risk = "generate", job = true, job_status = "GET /v1/speech/jobs/{jid}", job_cancel = "POST /v1/speech/jobs/{jid}/cancel", ask = ["name", "engine"], hide = ["stream", "timings", "no_save", "save_dir", "request_id", "format"], description = """Speak text aloud; the clip is saved to Outputs. `name` is a saved voice (tts_list_voices lists them) or a Kokoro voice such as af_heart; omit it for the default voice. With engine breeze, `instruction` describes the voice (when no name is given) or the delivery ("slow and warm").""", examples = [{ text = "Good morning, everyone.", name = "af_heart" }] }
list_voices = { op = "GET /v1/voices", core = true, fixed = { brief = true }, description = "List saved (Breeze) voices and Kokoro's built-in voices" }
design_voice = { op = "POST /v1/voices/design", risk = "generate", ask = ["name", "instruction"], hide = ["overwrite"], description = "Invent a voice from a description and save it under a name" }
clone_voice = { op = "POST /v1/voices", risk = "write", description = "Save a voice cloned from a 3-60 s reference clip" }
delete_voice = { op = "DELETE /v1/voices/{name}", description = "Delete a saved voice (permanent)", confirm = true }

[agent]
skills = "skills"            # skills/<name>/SKILL.md for the chat agent (plan 14.9)
