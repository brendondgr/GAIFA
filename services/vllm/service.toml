# vLLM (plan Phase 18): an adapter (port 5101) that serves one model profile at a time with vLLM, in
# kyuz0's patched image for Strix Halo (gfx1151), on 127.0.0.1:7801. Fields: architecture §4.3.
id = "vllm"
name = "vLLM"
description = "Serves Hugging Face models with vLLM, and publishes them to the relay"
icon = "cpu"
version = "0.1.0"

[run]
command = [".venv/bin/python", "-m", "vllm_mod", "--port", "{port}"]
port = 5101
health = "/health"
status = "/v1/status"
openapi = "/openapi.json"
start_timeout_s = 30
stop_timeout_s = 60                 # stopping the mod stops the engine container first
restart = "on-failure"
after = ["relay"]
install = "install.sh"

[run.env]
# Pinned: `:latest` moves. kyuz0/vllm-therock-gfx1151 built 2026-10-04 (vLLM 0.31.0+strix).
VLLM_IMAGE = "docker.io/kyuz0/vllm-therock-gfx1151@sha256:8002236ea7526491cf9b0b6a543408fb0be2baacbba656effc132aba2e44dd1d"
VLLM_ENGINE_PORT = "7801"
VLLM_STATE_DIR = "{root}/data/state/vllm"
HF_HOME = "{hf_home}"


[ui]
page = "ui/page.js"

[memory]
# Each load acquires its profile's own memory_gb (+ the processes' overhead) from AIHub first.
estimate_gb = 16
load = "POST /v1/load"
unload = "POST /v1/unload"
containers = ["aihub-vllm-*"]
idle_unload_s = 0                   # a reload takes minutes; unload by hand

[gpu]                              # plan 31.4: the relay takes an interactive GPU lease per request to this engine
class = "interactive"

[tools]
list_profiles = { op = "GET /v1/profiles", description = "vLLM's model profiles: model, memory, context, whether downloaded, and which is loaded" }
engine_status = { op = "GET /v1/engine", description = "The vLLM engine: state (unloaded, starting with its stage, ready, failed), the loaded profile, its endpoint and relay alias" }
load_llm = { op = "POST /v1/load", risk = "write", ask = ["profile"], fixed = { wait = false }, hide = ["make_room"], description = "Start vLLM with a profile (stops the running one first). Returns at once; a start takes 1–5 minutes (longer when it downloads), so check engine_status until it is ready." }
unload_llm = { op = "POST /v1/unload", confirm = true, description = "Stop vLLM and free its memory" }
