<script>
/* Theme before first paint: saved choice, else the OS. Storage may be unavailable; render regardless. */
(function(){var t='system';try{t=localStorage.getItem('lcpp.theme')||'system'}catch(e){}
var dark=t==='dark'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',dark?'dark':'light');})();
</script>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app lcpp" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand"><span id="logo"></span><span>lcpp</span><span class="ver" id="ver"></span></div>
    <nav id="nav" aria-label="Views"></nav>
    <div class="sidebar-foot">
      <div class="daemon" id="daemon-status"></div>
      <a id="relay-link" href="#" target="_blank" rel="noopener">Open Relay dashboard ↗</a>
      <div class="row" id="foot-badges"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="btn btn-ghost btn-icon" id="menu-btn" aria-label="Menu" aria-expanded="false"></button>
      <div class="brand"><span id="logo2"></span><span>lcpp</span></div>
    </div>
    <header class="header" id="header"></header>
    <div id="banner"></div>
    <main id="view" aria-live="polite"></main>
  </div>
</div>
<aside class="drawer" id="drawer" aria-label="Logs" hidden></aside>

<div id="dev"></div>
